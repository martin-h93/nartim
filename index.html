<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nartim.de</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --bg-color: #ffffff;
            --icon-filter: none;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --icon-filter: invert(1) drop-shadow(0 0 2px rgba(255,255,255,0.2));
            }
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 30px;
            padding: 20px 0;
            font-family: sans-serif;
            transition: background-color 0.3s ease;
        }

        .image-container img {
            max-width: 85vw;
            max-height: 55vh;
            object-fit: contain;
            display: block;
            border: none;
        }

        .mailto-link,
        .mailto-link:hover,
        .mailto-link:focus,
        .mailto-link:active,
        .mailto-link:visited {
            display: inline-block;
            text-decoration: none;
            outline: none !important;
            border: none !important;
            box-shadow: none !important;
        }

        .icon-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            max-width: 70vw;
            max-height: 25vh;
            filter: var(--icon-filter);
        }

        .icon-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: none;
            outline: none !important;
        }

        .icon-hover {
            display: none;
        }

        .mailto-link:hover .icon-default {
            display: none;
        }

        .mailto-link:hover .icon-hover {
            display: block;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img src="majestic.jpg" alt="">
    </div>

    <a href="mailto:martin@hoelters.online" class="mailto-link">
        <div class="icon-wrapper">
            <img src="mail-icon.png" alt="" class="icon-default">
            <img src="mail-icon2.png" alt="" class="icon-hover">
        </div>
    </a>

    <script>
        const text = "nartim.de";
        const emojiFrames = [
            " ( °-°) ",
            " ( °-°)" ,
            " (  °-°)",
            " (   °-)",
            " (    °)",
            " (     )",
            " (°    )",
            " (-°   )",
            " (°-°  )"
        ];

        let state = "BUILDING_ALL";
        let fullString = text + emojiFrames[0];
        let fullArray = Array.from(fullString);
        let currentIndex = 1;
        let emojiStep = 0;
        let emojiLoops = 0;

        const baseSpeed = 100;
        const maxEmojiLoops = 2;

        function tick() {
            if (state === "BUILDING_ALL") {
                currentIndex++;
                document.title = fullArray.slice(0, currentIndex).join('');

                if (currentIndex === fullArray.length) {
                    state = "ANIMATING_EMOJI";
                }
                setTimeout(tick, baseSpeed);
            } 
            else if (state === "ANIMATING_EMOJI") {
                fullString = text + emojiFrames[emojiStep];
                fullArray = Array.from(fullString);
                document.title = fullString;
                
                emojiStep = (emojiStep + 1) % emojiFrames.length;

                if (emojiStep === 0) {
                    emojiLoops++;
                }

                if (emojiLoops >= maxEmojiLoops) {
                    emojiLoops = 0;
                    emojiStep = 0;
                    currentIndex = fullArray.length;
                    state = "DELETING_ALL";
                }
                setTimeout(tick, baseSpeed);
            } 
            else if (state === "DELETING_ALL") {
                if (currentIndex > 1) {
                    currentIndex--;
                    document.title = fullArray.slice(0, currentIndex).join('');
                    setTimeout(tick, baseSpeed);
                } else {
                    fullString = text + emojiFrames[0];
                    fullArray = Array.from(fullString);
                    state = "BUILDING_ALL";
                    setTimeout(tick, baseSpeed * 3);
                }
            }
        }

        document.title = "n";
        setTimeout(tick, baseSpeed);
    </script>

</body>
</html>
