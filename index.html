<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nartim.de</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-color: #ffffff;
            --icon-filter: none;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --icon-filter: invert(1) drop-shadow(0 0 2px rgba(255,255,255,0.2));
            }
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 30px;
            padding: 20px 0;
            font-family: sans-serif;
            transition: background-color 0.3s ease;
        }

        .image-container img {
            max-width: 85vw;
            max-height: 55vh;
            object-fit: contain;
            display: block;
        }

        .mailto-link {
            display: inline-block;
            text-decoration: none;
            outline: none;
        }

        .mailto-link:focus,
        .mailto-link:active {
            outline: none;
        }

        .icon-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            max-width: 70vw;
            max-height: 25vh;
            filter: var(--icon-filter);
        }

        .icon-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .icon-hover {
            display: none;
        }

        .mailto-link:hover .icon-default {
            display: none;
        }

        .mailto-link:hover .icon-hover {
            display: block;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img src="majestic.jpg" alt="">
    </div>

    <a href="mailto:martin@hoelters.online" class="mailto-link">
        <div class="icon-wrapper">
            <img src="mail-icon.png" alt="" class="icon-default">
            <img src="mail-icon2.png" alt="" class="icon-hover">
        </div>
    </a>

</body>
</html>
