<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nartim.de/now</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0a0a0a;color:#fff;font-family:monospace,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px;}
        .container{width:100%;max-width:600px;display:flex;flex-direction:column;gap:24px;}
        header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:12px;font-size:14px;color:#888;}
        header a{color:#888;text-decoration:none;}
        header a:hover{color:#fff;}
        .widget{background:#121212;border:1px solid #222;padding:20px;border-radius:6px;display:flex;flex-direction:column;gap:12px;}
        .widget-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#666;}
        .widget-content{font-size:15px;display:flex;align-items:center;justify-content:space-between;}
        .status-dot{width:8px;height:8px;background:#4ade80;border-radius:50%;box-shadow:0 0 8px rgba(74,222,128,0.5);display:inline-block;margin-right:8px;}
        .track-info{display:flex;flex-direction:column;gap:4px;}
        .track-title{color:#fff;font-weight:bold;}
        .track-artist{color:#888;font-size:13px;}
        .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
        .stat-box{background:#181818;padding:12px;border-radius:4px;border:1px solid #262626;}
        .stat-label{font-size:11px;color:#777;margin-bottom:4px;}
        .stat-value{font-size:18px;color:#fff;}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <span>martin@nartim:~/now$</span>
            <a href="/">[.. back]</a>
        </header>

        <div class="widget">
            <div class="widget-title">// Spotify Now Playing</div>
            <div class="widget-content">
                <div class="track-info">
                    <span class="track-title">Titel wird geladen...</span>
                    <span class="track-artist">Interpret</span>
                </div>
                <div><span class="status-dot"></span>live</div>
            </div>
        </div>

        <div class="widget">
            <div class="widget-title">// Steam Now Playing</div>
            <div class="widget-content">
                <div class="track-info">
                    <span class="track-title">Aktuelles Spiel / Offline</span>
                    <span class="track-artist">Steam ID: nartim</span>
                </div>
            </div>
        </div>

        <div class="widget">
            <div class="widget-title">// Counter-Strike Stats</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">RATING / RANK</div>
                    <div class="stat-value">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">WIN RATE</div>
                    <div class="stat-value">--%</div>
                </div>
            </div>
        </div>

        <div class="widget">
            <div class="widget-title">// Letterboxd Last Watched</div>
            <div class="widget-content">
                <div class="track-info">
                    <span class="track-title">Film-Titel</span>
                    <span class="track-artist">Gesehen: --</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
